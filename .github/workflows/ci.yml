name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: pic
          POSTGRES_PASSWORD: pic_ci
          POSTGRES_DB: pic_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pic" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: pic_test
      DB_USER: pic
      DB_PASSWORD: pic_ci
      JWT_SECRET: ci-secret-no-productivo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Migraciones (subir, revertir y volver a subir)
        working-directory: backend
        run: |
          npx sequelize-cli db:migrate --env test
          npx sequelize-cli db:migrate:undo:all --env test
          npx sequelize-cli db:migrate --env test
      - name: Seeders
        working-directory: backend
        run: npx sequelize-cli db:seed:all --env test
      - name: Pruebas
        run: npm test
      - name: Build del frontend
        run: npm run build
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=moderate
